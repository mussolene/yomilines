name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: GITHUB_PAGES=true npm run build
      - name: Package static build
        run: |
          cd dist
          zip -r "../yomilines-${GITHUB_REF_NAME}-dist.zip" .
          cd ..
          shasum -a 256 "yomilines-${GITHUB_REF_NAME}-dist.zip" > "yomilines-${GITHUB_REF_NAME}-dist.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "yomilines-${GITHUB_REF_NAME}-dist.zip" \
            "yomilines-${GITHUB_REF_NAME}-dist.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "yomilines ${GITHUB_REF_NAME}" \
            --generate-notes
